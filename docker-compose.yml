services:
  goravel:
    command: ./main
    container_name: cek-resi-app
    build:
      context: .
    ports:
      - "3000:3000"
      - "50051:50051"
    depends_on:
      - postgres
      - redis
    environment:
      - APP_NAME=${APP_NAME}
      - APP_ENV=${APP_ENV}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG}
      - APP_URL=${APP_URL}
      - APP_HOST=${APP_HOST}
      - APP_PORT=${APP_PORT}

      - GRPC_HOST=${GRPC_HOST}
      - GRPC_PORT=${GRPC_PORT}

      - JWT_SECRET=${JWT_SECRET}

      - LOG_CHANNEL=${LOG_CHANNEL}
      - LOG_LEVEL=${LOG_LEVEL}

      - DB_CONNECTION=${DB_CONNECTION}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}

      - SESSION_DRIVER=${SESSION_DRIVER}
      - SESSION_LIFETIME=${SESSION_LIFETIME}

      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_PORT=${REDIS_PORT}

      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}

      - SPX_TOKEN=${SPX_TOKEN}

      - QUEUE_CONNECTION=${QUEUE_CONNECTION}
    volumes:
      - goravel:/www
      - ${CERTS_DIR:-./certs}:/www/certs
    restart: on-failure

  postgres:
    image: postgres:14.15-alpine3.21
    container_name: cek-resi-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  redis:
    image: redis:7.2.7-alpine
    container_name: cek-resi-redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
      
volumes:
  postgres_data:
  redis_data:
  goravel:
