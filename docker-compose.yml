services:
  goravel:
    container_name: cek-resi-app
    build:
      context: .
    ports:
      - "3000:3000"
      - "50051:50051"
    depends_on:
      - postgres
      - redis
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
    restart: on-failure

  postgres:
    image: postgres:14.15-alpine3.21
    container_name: cek-resi-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  redis:
    image: redis:7.2.7-alpine
    container_name: cek-resi-redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
      
volumes:
  postgres_data:
  redis_data:
