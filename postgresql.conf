# -----------------------------
# FILE: postgresql.conf
# -----------------------------

# Connection Settings
listen_addresses = '*'  # Dengarkan semua koneksi, sesuaikan jika hanya ingin localhost
port = 5432

# Memory Configuration (Sesuaikan dengan kebutuhan)
shared_buffers = 256MB
work_mem = 64MB
maintenance_work_mem = 128MB

# WAL (Write-Ahead Logging) Settings
wal_level = replica
synchronous_commit = on
checkpoint_timeout = 5min
max_wal_size = 1GB
min_wal_size = 80MB

# Logging & Monitoring
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql.log'
log_statement = 'none'  # Set ke 'all' jika ingin melihat semua query yang dieksekusi

# Autovacuum Configuration
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 60

# Performance Optimization
effective_cache_size = 512MB
random_page_cost = 1.1
default_statistics_target = 100

# Replication Settings (Hanya jika diperlukan)
max_wal_senders = 3
wal_keep_size = 256MB

unix_socket_directories = '/tmp'