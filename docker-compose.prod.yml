services:
  goravel:
    container_name: cek-resi-app
    image: edoaurahman/cek-resi-app:latest
    ports:
      - "3001:3000"
    depends_on:
      - postgres
      - redis
    environment:
      - DB_HOST=postgres
      - REDIS_HOST=redis
    restart: always
    cpus: "0.4"

  postgres:
    image: postgres:14.15-alpine3.21
    container_name: cek-resi-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2.7-alpine
    container_name: cek-resi-redis
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
